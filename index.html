<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрая заявка</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('NqFbTPR8xj8tDZAzzYlSIndJfvc5qEB1peEX796S.png'); /* Убедитесь, что файл существует */
            background-size: cover;
            background-position: center;
            color: #ffffff;
            margin: 0;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 0;
        }

        .form-container {
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 700px;
            backdrop-filter: blur(5px);
            box-sizing: border-box; /* Для корректного учета padding */
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #e0e0e0;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
            display: block; /* Чтобы label занимал всю строку */
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            font-size: 16px;
            width: 100%; /* Занимает всю доступную ширину */
            box-sizing: border-box; /* Корректное поведение width: 100% */
        }

        textarea {
            resize: vertical; /* Позволяет изменять размер только по вертикали */
        }

        input:focus,
        textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            outline: none;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .submit-button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 25px;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.4);
        }

        .submit-button:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        /* Стили для адаптивности */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr; /* Одноколоночная раскладка на маленьких экранах */
            }
            .form-container {
                padding: 20px;
                width: 95%; /* Занимает больше места на узких экранах */
            }
        }

        .error-message {
            color: #ffdddd;
            font-size: 13px;
            margin-top: 5px;
            display: block;
            min-height: 1em; /* Зарезервировать место, чтобы избежать скачков макета */
        }

        .loading-indicator {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="form-container">
        <h1>Создать заявку на доставку</h1>
        <form id="shippingForm">
            <div class="form-grid">
                <div class="form-row">
                    <label for="cargoType">Что везем?</label>
                    <input type="text" id="cargoType" name="cargoType" required placeholder="Например: Документы, Подарок">
                    <span id="cargoTypeError" class="error-message"></span>
                </div>

                <div class="form-row">
                    <label for="weight">Примерный вес (кг)</label>
                    <input type="number" id="weight" name="weight" min="1" required placeholder="От 1 кг">
                    <span id="weightError" class="error-message"></span>
                </div>

                <div class="form-row full-width">
                    <label for="departureAddress">Откуда забрать?</label>
                    <textarea id="departureAddress" name="departureAddress" rows="2" required placeholder="Город, улица, дом"></textarea>
                    <span id="departureAddressError" class="error-message"></span>
                </div>

                <div class="form-row full-width">
                    <label for="destinationAddress">Куда доставить?</label>
                    <textarea id="destinationAddress" name="destinationAddress" rows="2" required placeholder="Город, улица, дом"></textarea>
                    <span id="destinationAddressError" class="error-message"></span>
                </div>
            </div>

            <h2 style="margin-top: 30px; margin-bottom: 15px; text-align: center; color: #ffffff;">Ваши контакты</h2>
            <div class="form-grid">
                <div class="form-row">
                    <label for="recipientName">Ваше имя</label>
                    <input type="text" id="recipientName" name="recipientName" required placeholder="Иван">
                    <span id="recipientNameError" class="error-message"></span>
                </div>

                <div class="form-row">
                    <label for="phoneNumber">Телефон</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="89xxxxxxxxx">
                    <span id="phoneNumberError" class="error-message"></span>
                </div>

                <div class="form-row full-width">
                    <label for="email">Email (для информации)</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.com">
                    <span id="emailError" class="error-message"></span>
                </div>
            </div>

            <div class="loading-indicator">
                Открываем ваш почтовый клиент...
            </div>

            <button type="submit" class="submit-button">Отправить заявку</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('shippingForm');
        // !!! ВАЖНО: Замените 'YOUR_EMAIL@example.com' на ваш реальный email !!!
        const recipientEmail = 'kargoelim@gmail.com';

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Предотвращаем стандартную отправку формы

            // Очистка предыдущих сообщений об ошибках
            document.querySelectorAll('.error-message').forEach(span => span.textContent = '');

            let isValid = true;
            const errors = {};

            // Валидация полей
            if (!form.elements['cargoType'].value.trim()) {
                errors['cargoType'] = 'Опишите, что нужно перевезти.';
                isValid = false;
            }
            const weight = parseFloat(form.elements['weight'].value);
            if (isNaN(weight) || weight < 1) {
                errors['weight'] = 'Укажите вес от 1 кг.';
                isValid = false;
            }
            if (!form.elements['departureAddress'].value.trim()) {
                errors['departureAddress'] = 'Откуда забирать?';
                isValid = false;
            }
            if (!form.elements['destinationAddress'].value.trim()) {
                errors['destinationAddress'] = 'Куда доставить?';
                isValid = false;
            }
            if (!form.elements['recipientName'].value.trim()) {
                errors['recipientName'] = 'Как к вам обращаться?';
                isValid = false;
            }
            // Простая проверка на длину телефона (8-11 цифр)
            if (!/^[0-9]{8,11}$/.test(form.elements['phoneNumber'].value.replace(/\D/g, ''))) {
                 errors['phoneNumber'] = 'Введите корректный номер телефона.';
                 isValid = false;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(form.elements['email'].value.trim())) {
                errors['email'] = 'Формат email неверен.';
                isValid = false;
            }

            // Отображение ошибок
            for (const field in errors) {
                if (document.getElementById(field + 'Error')) {
                    document.getElementById(field + 'Error').textContent = errors[field];
                }
            }

            if (!isValid) {
                return; // Прекращаем, если есть ошибки
            }

            // Формирование тела письма
            let emailBody = `--- Заявка на доставку ---\n\n`;
            emailBody += `Что везем: ${form.elements['cargoType'].value.trim()}\n`;
            emailBody += `Примерный вес: ${weight.toFixed(1)} кг\n`;
            emailBody += `Откуда: ${form.elements['departureAddress'].value.trim()}\n`;
            emailBody += `Куда: ${form.elements['destinationAddress'].value.trim()}\n\n`;
            emailBody += `--- Контакты ---\n`;
            emailBody += `Имя: ${form.elements['recipientName'].value.trim()}\n`;
            emailBody += `Телефон: ${form.elements['phoneNumber'].value.trim()}\n`;
            emailBody += `Email: ${form.elements['email'].value.trim()}\n`;

            const subject = encodeURIComponent('Быстрая заявка на доставку');
            const mailtoLink = `mailto:${recipientEmail}?subject=${subject}&body=${encodeURIComponent(emailBody)}`;

            // Показываем индикатор загрузки
            document.querySelector('.loading-indicator').style.display = 'block';

            // Открываем почтовый клиент
            window.location.href = mailtoLink;

            // Скрываем индикатор и сообщаем пользователю
            setTimeout(() => {
                document.querySelector('.loading-indicator').style.display = 'none';
                alert('Ваш почтовый клиент открыт. Пожалуйста, проверьте данные и нажмите "Отправить".');
            }, 500);
        });
    </script>
</body>
</html>
